    drain('hatc', t, (e) => { if (t - e.t < 0.2) kickRays(3, 0.55 * e.v / 0.42); });
    drain('hato', t, (e) => { if (t - e.t < 0.2) kickRays(11, 0.8 * e.v / 0.62); });
    drain('clap', t, (e) => { e.b = [Math.random(), Math.random(), Math.random(), Math.random(), Math.random()]; claps.push(e); });
    drain('tom', t, (e) => toms.push(e));
    drain('rim', t, (e) => { e.a = (e.side ? 0 : Math.PI) + (Math.random() - 0.5) * 1.5; sparks.push(e); });
    drain('bass', t, (e) => { bassX = clamp((e.n - 31) / 10) * 2 - 1; });
    drain('lead', t, (e) => stars.push(e));
    drain('mark', t, (e) => { marks.push(e); kickRays(NR * 2, 0.5 * e.s); });
  }

  // trails: fade, and every fourth frame take one level off so nothing sticks
  const f = 1 - Math.exp(-dt / 0.2);
  const ss = (c) => { c = clamp(c, 0, 0.94); return c * f / (1 - c * (1 - f)); };   // per-frame alpha that settles at brightness c
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,5,5,' + f.toFixed(4) + ')'; ctx.fillRect(0, 0, W, H);
  if ((frameN & 3) === 0) { ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = 'rgb(1,1,1)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }

  // where the moon is
  const chordNow = D.chords[bar], inTot = bf >= 48 && bf < 88;
  lean += ((inTot ? NUDGE[chordNow] : 0) - lean) * (1 - Math.exp(-dt / 0.22));
  const d = lane(MOON_PATH, bf) + lean;
  const MX = CX + d * R * Math.cos(TH), MY = CY + d * R * Math.sin(TH);
  const kp = Math.exp(-Math.max(0, t - lastKick) / 0.11);
  const RM = R * MOON * (1 + 0.02 * kp);
  const tot = clamp(1 - Math.abs(d) / 0.5);                 // 1 when the sun is covered
  const pump = 1 - 0.3 * duck;                              // the sidechain, on everything the kick ducks
  const wet = 0.22 + 0.75 * pad + 0.85 * hall + 1.1 * riser;

  // corona glow
  const cg = gF * pump * tot * (0.05 + 0.2 * pad + 0.26 * hall + 0.25 * riser);
  if (cg > 0.004) { const g = ctx.createRadialGradient(CX, CY, R, CX, CY, R * 2.9); const a = ss(cg); g.addColorStop(0, ink(a)); g.addColorStop(0.3, ink(a * 0.4)); g.addColorStop(1, ink(0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R * 2.9, 0, 6.2832); ctx.fill(); }
  // the sun's own halo while part of it shows
  const sunBase = 0.13 + 0.87 * Math.pow(bright, 0.85);
  const hg = gF * pump * (1 - tot) * sunBase * 0.16;
  if (hg > 0.004) { const g = ctx.createRadialGradient(CX, CY, R * 0.9, CX, CY, R * 1.75); const a = ss(hg); g.addColorStop(0, ink(a)); g.addColorStop(1, ink(0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R * 1.75, 0, 6.2832); ctx.fill(); }

  // rays: pad and reverb hold them up, every hat flicks a few
  const rb = gF * pump * (0.1 + 0.9 * tot) * wet, decay = Math.exp(-dt / 0.1), rot = at * 0.012;
  ctx.lineWidth = 1; ctx.lineCap = 'butt';
  for (let i = 0; i < NR; i++) {
    const r = rays[i]; r.imp *= decay;
    const n = (0.5 + 0.5 * Math.sin(at * r.w1 + r.p1)) * (0.5 + 0.5 * Math.sin(at * r.w2 + r.p2));
    const len = R * (rb * (0.2 + 1.1 * n) * r.l + r.imp * 0.36 * gF);
    if (len < 1.5) continue;
    const c = gF * ((0.06 + 0.3 * tot) * (0.35 + 0.65 * n) * Math.min(1, wet) + r.imp * 0.34);
    const a = r.a + rot, x0 = CX + Math.cos(a) * R * 1.05, y0 = CY + Math.sin(a) * R * 1.05;
    ctx.strokeStyle = ink(ss(c)); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(a) * len, y0 + Math.sin(a) * len); ctx.stroke();
  }
  // hats and shaker as grain on the limb
  const grains = Math.round(hi * 26 * Math.min(2, dt * 60));
  ctx.fillStyle = ink(0.55 * gF);
  for (let i = 0; i < grains; i++) { const a = Math.random() * 6.2832, rr = R * (1.045 + Math.random() * 0.13); ctx.fillRect(CX + Math.cos(a) * rr, CY + Math.sin(a) * rr, 1, 1); }

  // the stab and its echoes: five lines, one per chord note, low notes inside. A closed filter shows only the low ones.
  for (let i = arcs.length - 1; i >= 0; i--) {
    const e = arcs[i], life = e.k === 0 ? 1.9 : 1.5, age = t - e.t;
    if (age > life || age < 0) { arcs.splice(i, 1); continue; }
    const u = age / life, r0 = R * (1.1 + 0.7 * (1 - (1 - u) * (1 - u))), al = gF * pump * e.amp * Math.pow(1 - u, 1.5) * (e.k === 0 ? 0.42 : 0.3);
    const span = e.k === 0 ? 1.2 : Math.max(0.5, 0.98 - 0.035 * e.k), tilt = 0.14 * Math.sin(e.id * 1.7 + e.k * 0.9);
    const notes = VOICING[e.ch];
    ctx.lineWidth = e.k === 0 ? 1.25 : 1;
    for (let j = 0; j < 5; j++) {
      const w = clamp(0.36 + bright * 1.3 - j * 0.21); if (w * al < 0.012) continue;
      const rj = r0 + (notes[j] - 48) * R * 0.0165;
      ctx.strokeStyle = ink(al * w * (j === 0 ? 1 : 0.82));
      if (e.k === 0 || e.side === 1) { ctx.beginPath(); ctx.arc(CX, CY, rj, tilt - span, tilt + span); ctx.stroke(); }
      if (e.k === 0 || e.side === 0) { ctx.beginPath(); ctx.arc(CX, CY, rj, Math.PI + tilt - span, Math.PI + tilt + span); ctx.stroke(); }
    }
  }

  // kick: one pressure ring off the limb
  ctx.lineWidth = 1;
  for (let i = kicks.length - 1; i >= 0; i--) { const age = t - kicks[i].t; if (age > 0.46 || age < 0) { kicks.splice(i, 1); continue; } const u = age / 0.46; ctx.strokeStyle = ink(0.24 * gF * (1 - u) * (1 - u)); ctx.beginPath(); ctx.arc(CX, CY, R * (1.06 + 1.0 * (1 - (1 - u) * (1 - u))), 0, 6.2832); ctx.stroke(); }

  // rim: a spark off the limb, twice more through the delay
  for (let i = sparks.length - 1; i >= 0; i--) { const e = sparks[i], age = t - e.t; if (age > 0.42 || age < 0) { sparks.splice(i, 1); continue; } const u = age / 0.42, rr = R * (1.08 + 1.25 * u); ctx.fillStyle = ink(0.85 * gF * e.v * (1 - u)); ctx.fillRect(CX + Math.cos(e.a) * rr - 1, CY + Math.sin(e.a) * rr - 1, 2, 2); }

  // the lead: stars come out in totality. One per note, higher notes further out, a phrase reads left to right over the top.
  for (let i = stars.length - 1; i >= 0; i--) {
    const e = stars[i], age = t - e.t; if (age < 0 || t > e.end + 2.5 * BAR) { stars.splice(i, 1); continue; }
    const rr = R * (1.78 + 0.72 * e.p), x = Math.round(CX + Math.cos(e.a) * rr), y = Math.round(CY + Math.sin(e.a) * rr);
    const out = clamp((e.end + 2.5 * BAR - t) / (1.5 * BAR));
    const c = gF * out * (0.34 + 0.62 * Math.exp(-age / 0.45)), s = 3 + Math.round(3 * e.len / 14 + 3 * Math.exp(-age / 0.2));
    ctx.fillStyle = ink(ss(c)); ctx.fillRect(x - s, y, 2 * s + 1, 1); ctx.fillRect(x, y - s, 1, 2 * s + 1);
    if (e.prev >= 0) { const q = EV.lead[e.prev], qr = R * (1.78 + 0.72 * q.p), k = clamp(age / 0.25); const qx = CX + Math.cos(q.a) * qr, qy = CY + Math.sin(q.a) * qr; ctx.strokeStyle = ink(ss(0.14 * gF * out)); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(qx + (x - qx) * k, qy + (y - qy) * k); ctx.stroke(); }
    for (let k = 1; k <= 2; k++) { const ea = age - k * 1.5 * BEAT; if (ea > 0 && ea < 1.2) { ctx.fillStyle = ink(0.5 * gF * Math.pow(0.42, k) * (1 - ea / 1.2)); ctx.fillRect(Math.round(CX + Math.cos(e.a) * (rr + 9 * k)), Math.round(CY + Math.sin(e.a) * (rr + 9 * k)), 2, 2); } }
  }

  // the ground: the bass swells it, toms hop off it, the clap flashes along it
  ctx.strokeStyle = ink(ss(gF * (0.1 + 0.4 * bass))); ctx.lineWidth = 1; ctx.beginPath();
  const bx = CX + bassX * R * 0.9, bh = bass * R * 0.34, sig = R * 0.85;
  for (let i = 0; i <= 48; i++) { const x = i / 48 * W, y = GY - bh * Math.exp(-((x - bx) * (x - bx)) / (2 * sig * sig)); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  for (let i = toms.length - 1; i >= 0; i--) { const e = toms[i], age = t - e.t; if (age > 0.5 || age < 0) { toms.splice(i, 1); continue; } const u = age / 0.5; ctx.fillStyle = ink(0.85 * gF * (1 - 0.5 * u)); ctx.fillRect(Math.round(CX + (e.i - 1) * R * 0.85) - 1, Math.round(GY - 4 - 4 * R * 0.24 * e.g * u * (1 - u)) - 1, 3, 3); }
  for (let i = claps.length - 1; i >= 0; i--) {
    const e = claps[i], age = t - e.t; if (age > 0.3 || age < 0) { claps.splice(i, 1); continue; }
    ctx.fillStyle = ink(0.5 * gF * Math.exp(-age / 0.06)); ctx.fillRect(0, GY, W, 1);
    const lx = tot > 0.5 ? MX : CX, ly = tot > 0.5 ? MY : CY, lr = tot > 0.5 ? RM : R;     // beads on whichever limb is showing
    ctx.fillStyle = ink(0.9 * gF * (1 - age / 0.3));
    for (let k = 0; k < 5; k++) { const a = e.b[k] * 6.2832; ctx.fillRect(Math.round(lx + Math.cos(a) * (lr + 2)) - 1, Math.round(ly + Math.sin(a) * (lr + 2)) - 1, 2, 2); }
  }

  // the sun (opaque, so it is exactly as bright as the filter is open), then the moon over it
  const flash = lastStabV * 0.3 * Math.exp(-Math.max(0, t - lastStab) / 0.13);
  const sl = gF * clamp(sunBase * pump + flash);
  if (tot < 1 || Math.abs(lean) > 0.004) { const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, R); g.addColorStop(0, tone(sl)); g.addColorStop(0.7, tone(sl * 0.93)); g.addColorStop(1, tone(sl * 0.66)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.2832); ctx.fill(); }
  ctx.fillStyle = '#050505'; ctx.beginPath(); ctx.arc(MX, MY, RM, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = ink(gF * (0.07 + 0.1 * hi + 0.12 * tot * pad)); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(MX, MY, RM, 0, 6.2832); ctx.stroke();

  // contacts: a diamond on the limb where the last light goes (bar 48) and where it comes back (bar 88)
  for (let i = marks.length - 1; i >= 0; i--) {
    const e = marks[i], age = t - e.t; if (age > 1.8 || age < 0) { marks.splice(i, 1); continue; }
    if (e.diamond === undefined) continue;
    const k = Math.exp(-age / 0.45), x = CX + Math.cos(e.diamond) * R, y = CY + Math.sin(e.diamond) * R, L = R * 0.75 * k;
    ctx.strokeStyle = ink(0.8 * k * gF); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
    ctx.fillStyle = ink(k * gF); ctx.beginPath(); ctx.arc(x, y, 1.5 + 3 * k, 0, 6.2832); ctx.fill();
  }

  // dust: the vinyl crackle under everything
  const dust = lane(D.lanes.noise, bf) * gF * 34 * dt, nd = Math.floor(dust) + (Math.random() < dust % 1 ? 1 : 0);
  for (let i = 0; i < nd; i++) { ctx.fillStyle = ink(0.18 + Math.random() * 0.4); ctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1, 1); }

  if ((frameN & 7) === 0 || DEBUG_T !== null) {
    $('sec').textContent = sectionAt(bf); $('barno').textContent = started ? 'bar ' + (bar + 1) : 'bar —'; $('chord').textContent = CHORD[chordNow];
    $('bar').style.width = (100 * clamp(t / DUR)).toFixed(2) + '%';
  }
}

// ---- the clock: the audio element's own time, carried between its updates by the frame clock
let anchorT = 0, anchorNow = 0, lastCt = -1, lastNow = performance.now();
function songTime(now) {
  const ct = audio.currentTime || 0;
  if (audio.paused || audio.ended || audio.seeking) { anchorT = ct; anchorNow = now; lastCt = ct; return ct; }
  if (ct !== lastCt) { lastCt = ct; const est = anchorT + (now - anchorNow) / 1000; anchorT = Math.abs(est - ct) > 0.08 ? ct : est + (ct - est) * 0.15; anchorNow = now; }
  return Math.min(DUR, anchorT + (now - anchorNow) / 1000);
}
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000)); lastNow = now;
  frame(songTime(now), now / 1000, dt, started);
}

if (DEBUG_T !== null) {            // a still at ?t=seconds, for checking a moment without the audio
  started = true; btn.classList.add('playing');
  const still = () => { lastT = -9; for (let t = Math.max(0, DEBUG_T - 6); t <= DEBUG_T; t += 1 / 60) frame(t, t, 1 / 60, true); };
  still(); afterResize = still;
} else {
  seekCursors(0); requestAnimationFrame(tick);
}

// ---- controls
const say = (s) => { msg.textContent = s; };
async function play() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (audio.ended) audio.currentTime = 0;
  started = true; say(audio.readyState < 3 ? 'LOADING' : '');
  try { await audio.play(); } catch (e) { say(audio.error ? 'THE AUDIO DID NOT LOAD. RELOAD THE PAGE.' : 'TAP PLAY AGAIN'); }
}
btn.addEventListener('click', play);
audio.addEventListener('playing', () => { btn.classList.add('playing'); btn.setAttribute('aria-label', 'Pause'); say(''); });
audio.addEventListener('waiting', () => { if (!audio.paused) say('LOADING'); });
audio.addEventListener('pause', () => { btn.classList.remove('playing'); btn.setAttribute('aria-label', 'Play Halbschatten'); btn.textContent = '▶'; });
audio.addEventListener('ended', () => { btn.classList.remove('playing'); btn.textContent = '↻'; btn.setAttribute('aria-label', 'Play again'); });
let retried = false;
audio.addEventListener('error', () => {
  if (retried || DEBUG_T !== null) { say('THE AUDIO DID NOT LOAD. RELOAD THE PAGE.'); return; }
  retried = true; say('LOADING');   // second route: fetch the file and play it from memory
  fetch(audio.getAttribute('src')).then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then((b) => { audio.src = URL.createObjectURL(b); say(started ? 'TAP PLAY' : ''); })
    .catch(() => say('THE AUDIO DID NOT LOAD. RELOAD THE PAGE.'));
});
canvas.addEventListener('click', () => { if (!audio.paused) audio.pause(); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { if (e.target === btn) return; e.preventDefault(); audio.paused ? play() : audio.pause(); }
  else if (e.code === 'ArrowRight') audio.currentTime = Math.min(DUR - 1, audio.currentTime + 5);
  else if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
});
const seek = $('seek'); let dragging = false;
const seekTo = (e) => { const x = clamp(e.clientX / W); try { audio.currentTime = x * (isFinite(audio.duration) ? audio.duration : DUR); started = true; } catch (err) {} seek.setAttribute('aria-valuenow', Math.round(x * DUR)); };
seek.addEventListener('pointerdown', (e) => { dragging = true; try { seek.setPointerCapture(e.pointerId); } catch (err) {} seekTo(e); });
seek.addEventListener('pointermove', (e) => { if (dragging) seekTo(e); });
seek.addEventListener('pointerup', () => { dragging = false; });
seek.addEventListener('pointercancel', () => { dragging = false; });
})();
</script>
</body>
