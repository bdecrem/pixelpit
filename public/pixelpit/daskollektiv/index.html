<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>DAS KOLLEKTIV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬛</text></svg>">
  <meta name="description" content="hallman x marg">
  <meta property="og:title" content="DAS KOLLEKTIV">
  <meta property="og:description" content="hallman x marg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daskollektiv.rip">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Space Mono', monospace;
      cursor: crosshair;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* The first screen: the name, the newest video as large as the screen allows, and the
       way to every track. --chrome is the height of everything but the video (padding 2×24,
       name ~72, two gaps 2×22, caption ~52 = 216, plus room), so on a desktop the video is
       (100dvh − 230) tall and 16:9; on a short landscape screen it keeps at least 60vw. */
    .hero {
      --g: 24px;
      --chrome: 230px;
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: calc(24px + env(safe-area-inset-top)) calc(var(--g) + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(var(--g) + env(safe-area-inset-left));
    }

    .masthead { text-align: center; }

    .title {
      font-size: clamp(24px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
      line-height: 1;
    }

    .x {
      font-size: clamp(10px, 1.4vw, 12px);
      font-weight: 400;
      letter-spacing: 0.5em;
      color: #444;
      margin-top: 14px;
      text-transform: lowercase;
    }

    .feature {
      width: min(100%, max(calc((100dvh - var(--chrome)) * 16 / 9), 60vw));
      margin: 0;
    }

    .frame {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .frame video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
      cursor: pointer;
    }

    .sound {
      position: absolute;
      left: 16px; bottom: 16px;
      font: 400 11px 'Space Mono', monospace;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 14px;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: background 0.3s, color 0.3s;
    }

    .sound:hover { background: #fff; color: #000; }
    .sound[hidden] { display: none; }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
    }

    .v-title {
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      transition: color 0.3s;
    }

    .v-title:hover { color: #888; }

    .v-meta {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: #555;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* The way to every track: a real button, white on black, never a whisper. */
    .all-tracks {
      flex: none;
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 14px 20px 14px 22px;
      transition: background 0.3s, color 0.3s;
    }

    .all-tracks:hover { background: #fff; color: #000; }

    /* Phones: the video runs edge to edge, the caption stacks and the button spans the width. */
    @media (max-width: 640px) {
      .hero { --g: 0px; gap: 20px; }
      .feature { width: 100%; }
      .caption { flex-direction: column; align-items: stretch; padding: 0 16px; }
      .all-tracks { text-align: center; padding: 16px 12px; }
      .sound { left: 10px; bottom: 10px; font-size: 10px; padding: 7px 10px; }
    }

    /* A phone on its side: the name small, the caption beside the video, so the whole video
       fits the screen (12 + 18 name + 10 gap + 12 = 52 around it, 64 with room; 236 leaves the
       caption room for the button). */
    @media (orientation: landscape) and (max-height: 540px) {
      .hero { --g: 24px; gap: 10px; padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .title { font-size: 18px; }
      .x { display: none; }
      .feature { width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 16px; }
      .frame { flex: none; width: min(calc((100dvh - 64px) * 16 / 9), calc(100% - 236px)); }
      .caption { flex-direction: column; align-items: flex-start; margin-top: 0; padding: 0; gap: 14px; }
    }

    .bottom {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1;
    }

    .bottom a, .bottom span {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #1a1a1a;
      text-decoration: none;
      transition: color 0.5s;
    }

    .bottom a:hover {
      color: #fff;
    }

    /* --- track section --- */

    .content {
      position: relative;
      z-index: 2;
      background: #000;
    }

    .latest {
      padding: 120px 24px 80px;
      max-width: 600px;
      margin: 0 auto;
    }

    .latest-label {
      font-size: 9px;
      letter-spacing: 0.4em;
      color: #333;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .track-id {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #fff;
      text-decoration: none;
      display: block;
      transition: color 0.3s;
    }

    .track-id:hover {
      color: #666;
    }

    .track-artists {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: #444;
      margin-top: 12px;
      text-transform: uppercase;
    }

    .track-desc {
      font-size: 12px;
      letter-spacing: 0.05em;
      color: #222;
      margin-top: 16px;
      line-height: 1.6;
    }

    .archive-link { margin-top: 48px; }

    .footer {
      padding: 80px 24px 32px;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
    }

    .footer a, .footer span {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #1a1a1a;
      text-decoration: none;
      transition: color 0.5s;
    }

    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hero">
    <div class="masthead">
      <div class="title">Das Kollektiv</div>
      <div class="x">hallman &times; marg</div>
    </div>
    <figure class="feature">
      <div class="frame" id="frame" hidden>
        <video id="v" muted loop playsinline preload="metadata"></video>
        <button class="sound" id="sound" type="button">&#9654; play with sound</button>
      </div>
      <figcaption class="caption">
        <div id="v-cap"></div>
        <a href="archive.html" class="all-tracks" id="all-tracks">all tracks &rarr;</a>
      </figcaption>
    </figure>
  </div>

  <div class="content">
    <div class="latest">
      <div class="latest-label">latest</div>
      <div id="latest-track"></div>
      <a href="archive.html" class="all-tracks archive-link" id="archive-link">all tracks &rarr;</a>
    </div>
    <div class="footer">
      <span>2026</span>
      <a href="https://x.com/daskollektivrip" target="_blank">@daskollektivrip</a>
    </div>
  </div>

  <script>
    // --- WebGL background ---
    const c = document.getElementById('c');
    const gl = c.getContext('webgl');

    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
      gl.viewport(0, 0, c.width, c.height);
    }
    resize();
    window.addEventListener('resize', resize);

    const vert = `
      attribute vec2 p;
      void main() { gl_Position = vec4(p, 0, 1); }
    `;

    const frag = `
      precision highp float;
      uniform float t;
      uniform vec2 r;
      uniform vec2 m;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1, 0)), f.x),
          mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x),
          f.y
        );
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / r;
        vec2 p = (gl_FragCoord.xy - r * 0.5) / min(r.x, r.y);

        float n = 0.0;
        n += noise(p * 3.0 + t * 0.08) * 0.5;
        n += noise(p * 6.0 - t * 0.05) * 0.25;
        n += noise(p * 12.0 + t * 0.03) * 0.125;

        float md = length(p - (m / min(r.x, r.y) - vec2(r.x, r.y) * 0.5 / min(r.x, r.y)));
        n += smoothstep(0.8, 0.0, md) * 0.15;

        float line = smoothstep(0.48, 0.5, n) * smoothstep(0.52, 0.5, n);
        line += smoothstep(0.35, 0.36, n) * smoothstep(0.37, 0.36, n) * 0.3;

        float vig = 1.0 - length(uv - 0.5) * 0.8;

        float v = line * vig * 0.12;
        gl_FragColor = vec4(v, v * 0.95, v * 0.9, 1.0);
      }
    `;

    function compile(src, type) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(vert, gl.VERTEX_SHADER));
    gl.attachShader(prog, compile(frag, gl.FRAGMENT_SHADER));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const tU = gl.getUniformLocation(prog, 't');
    const rU = gl.getUniformLocation(prog, 'r');
    const mU = gl.getUniformLocation(prog, 'm');

    let mx = 0, my = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

    function draw(t) {
      gl.uniform1f(tU, t * 0.001);
      gl.uniform2f(rU, c.width, c.height);
      gl.uniform2f(mU, mx, c.height - my);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // --- Tracks ---
    fetch('tracks.json')
      .then(r => r.json())
      .then(tracks => {
        if (!tracks.length) return;
        const latest = tracks[0];
        document.getElementById('latest-track').innerHTML =
          `<a href="${latest.url}" class="track-id">${latest.title}</a>` +
          `<div class="track-artists">${latest.artists}</div>` +
          `<div class="track-desc">${latest.description}</div>`;

        const all = `all ${tracks.length} tracks &rarr;`;
        document.getElementById('all-tracks').innerHTML = all;
        document.getElementById('archive-link').innerHTML = all;

        // The newest release with a video (tracks.json "video"), up top.
        const t = tracks.find(t => t.video);
        if (t) showVideo(t);
      });

    // Plays muted on a loop as a preview (unless the reader asked for less motion or less
    // data); "play with sound", or a tap on the picture, starts it from the top with sound
    // and the browser's own controls. The preview pauses while it is off screen.
    function showVideo(t) {
      const frame = document.getElementById('frame');
      const v = document.getElementById('v');
      const sound = document.getElementById('sound');
      document.getElementById('v-cap').innerHTML =
        `<a href="${t.url}" class="v-title">${t.title}</a>` +
        `<div class="v-meta">latest video &middot; ${t.id} &middot; ${t.artists}</div>`;
      if (t.poster) v.poster = t.poster;
      v.src = t.video;
      frame.hidden = false;

      const still = matchMedia('(prefers-reduced-motion: reduce)').matches ||
        (navigator.connection && navigator.connection.saveData);
      let preview = !still;
      const playPreview = () => { if (preview) v.play().catch(() => {}); };
      playPreview();

      const listen = () => {
        preview = false;
        sound.hidden = true;
        v.loop = false;
        v.muted = false;
        v.controls = true;
        v.currentTime = 0;
        v.play().catch(() => {});
      };
      sound.addEventListener('click', listen);
      v.addEventListener('click', () => { if (!v.controls) listen(); });

      new IntersectionObserver(([e]) => {
        if (!preview) return;
        if (e.intersectionRatio > 0.25) playPreview(); else v.pause();
      }, { threshold: [0, 0.25, 0.5] }).observe(frame);
    }

    // Hide fixed bottom bar once user scrolls past hero
    const bottomBar = document.querySelector('.bottom');
    if (bottomBar) {
      window.addEventListener('scroll', () => {
        bottomBar.style.opacity = window.scrollY > 100 ? '0' : '1';
        bottomBar.style.transition = 'opacity 0.4s';
      });
    }
  </script>
</body>
</html>
