<script>
// ============================================================
// STREULICHT: stray light. One line, drawn by one pen, round a clock face.
// One turn of the face is one bar; the sixteen ticks on the rim are its sixteenths.
// The pen is the sequencer line. Every note throws it outward, as far as the note is high, and it falls
// back as the note decays: the shape it draws is the line's own envelope, ringing when the filter rings.
// White is the pen now. Blue is where it has been: the tail is as long as the reverb is wet.
// With all 8 stages the row fits the bar twice and the figure stands still, blue under white.
// When the player drops to 7 or 6 stages the row slips against the bar: the figure turns, and the blue
// of the last bar shows beside the white of this one. That is the track.
// Inside: sixteen teeth for the bass, a pulse for the kick. Outside: the lead, by hand, in amber.
// Everything is read from the score and its lanes. Plain <audio>, no WebAudio.
// ============================================================
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const audio = $('a'), btn = $('play'), msg = $('msg');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search), DEBUG_T = Q.has('t') ? parseFloat(Q.get('t')) : null;

const BAR = D.bar, STEP = BAR / 16, FPS = D.fps, DUR = D.duration, TAU = Math.PI * 2;
const HZ = 240, SUB = 4, NP = Math.ceil(DUR * HZ) + 2;             // the pen is worked out once, 240 points a second
const SECTIONS = [[0, 'One line'], [8, 'Floor'], [16, 'Undertow'], [32, 'Seven'], [40, 'One finger'], [56, 'Scatter'], [64, 'Seven again'], [72, 'By hand'], [88, 'Wide open'], [96, 'Six'], [104, 'Eight'], [112, 'Closing'], [124, 'Stray light']];
const BG = '#050505', WHITE = '236,240,255', BLUE = '48,104,255', GHOST = '128,166,255', WARM = '255,176,92';
const PREVIEW_T = 20.5 * BAR;                                       // what the face shows before play

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const rgba = (c, a) => 'rgba(' + c + ',' + clamp(a).toFixed(4) + ')';
const b64 = (s) => { const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
const ENV = {}; for (const k in D.env) ENV[k] = b64(D.env[k]);
const envAt = (k, t) => { const a = ENV[k], x = t * FPS, i = Math.floor(x); if (i < 0) return 0; if (i >= a.length - 1) return a[a.length - 1] / 255; const f = x - i; return (a[i] * (1 - f) + a[i + 1] * f) / 255; };
const lane = (pts, b) => { if (b <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++) if (b < pts[i][0]) { const p = pts[i - 1], q = pts[i]; return p[1] + (q[1] - p[1]) * (b - p[0]) / (q[0] - p[0]); } return pts[pts.length - 1][1]; };
const L = D.lanes, LOG = {}; for (const k of ['lbase', 'bbase']) LOG[k] = L[k].map((p) => [p[0], Math.log(p[1])]);
const lanex = (k, b) => Math.exp(lane(LOG[k], b));
const sectionAt = (b) => { let n = SECTIONS[0][1]; for (const s of SECTIONS) if (b >= s[0]) n = s[1]; return n; };
const stagesAt = (b) => { let s = D.sections[0]; for (const x of D.sections) if (b >= x[0]) s = x; return s; };

// ---- the score
const EV = {};
EV.kick = D.ev.kick.map((t) => ({ t }));
EV.line = D.ev.line.map((e) => ({ t: e[0], n: e[1], len: e[2], acc: e[3], v: e[4], st: e[5] }));
EV.bass = D.ev.bass.map((e) => ({ t: e[0], n: e[1], acc: e[2], v: e[3] }));
EV.lead = D.ev.lead.map((e) => ({ t: e[0], n: e[1], len: e[2], leg: e[3], v: e[4] }));
EV.clap = D.ev.clap.map((t) => ({ t }));
EV.hat = D.ev.hat.map((e) => ({ t: e[0], v: e[1], dec: e[2] }));
EV.ohat = D.ev.ohat.map((e) => ({ t: e[0], v: e[1] }));
const cur = {}; for (const k in EV) cur[k] = 0;
function seekCursors(t) { for (const k in EV) { const ev = EV[k]; let lo = 0, hi = ev.length; while (lo < hi) { const m = (lo + hi) >> 1; if (ev[m].t < t) lo = m + 1; else hi = m; } cur[k] = lo; } }
function drain(k, t, fn) { const ev = EV[k]; let i = cur[k]; while (i < ev.length && ev[i].t <= t) { fn(ev[i]); i++; } cur[k] = i; }

// ---- the pen, worked out from the score the way the synth works out its envelopes
const LR = new Float32Array(NP), LB = new Float32Array(NP);        // the line: how far out, how bright
const VR = new Float32Array(NP), VA = new Float32Array(NP);        // the lead: where in its band, how loud
(function simulate() {
  const dt = 1 / (HZ * SUB), FR = Math.log(4200 / 150);
  // the line
  let k = 0, ev = EV.line, tgt = 0.3, pc = 0.3, gate = false, gEnd = -1, lvl = 0, att = false, fe = 0, acc = 0, vel = 1, s1 = 0, s2 = 0;
  let adec = 0, sus = 0, rel = 0, fd = 0, gl = 0, base = 200, amt = 1.4, a1 = 0, a2 = 0, a3 = 0;
  for (let i = 0; i < NP * SUB; i++) {
    const t = i * dt;
    if (i % SUB === 0) {
      const bf = t / BAR, g_ = lane(L.gl, bf), res = lane(L.lres, bf);
      adec = Math.exp(-dt / lane(L.adec, bf)); sus = lane(L.sus, bf); rel = Math.exp(-dt / lane(L.rel, bf)); fd = Math.exp(-dt / lane(L.fdec, bf));
      gl = g_ > 1e-5 ? Math.exp(-dt / g_) : 0; base = lanex('lbase', bf); amt = lane(L.lamt, bf);
      // the pen's own inertia: slow and round when the filter is shut, quick when it is open, ringing with the resonance
      const open = clamp(Math.log(base / 200) / Math.log(1700 / 200)), g = Math.tan(Math.PI * (10 + 34 * open) * dt), kq = 1 / clamp(0.55 + 0.8 * (res - 1), 0.5, 2.2);
      a1 = 1 / (1 + g * (g + kq)); a2 = g * a1; a3 = g * a2;
    }
    while (k < ev.length && ev[k].t <= t) { const e = ev[k]; tgt = 0.3 + 0.7 * (e.n - 52) / 15; att = true; fe = 1 + 0.4 * e.acc; vel = e.v; acc = e.acc; gate = true; gEnd = e.t + e.len; k++; }
    if (gate && t >= gEnd) gate = false;
    pc = tgt + (pc - tgt) * gl;
    if (gate) { if (att) { lvl += dt / 0.0015; if (lvl >= 1) { lvl = 1; att = false; } } else lvl = sus + (lvl - sus) * adec; } else { lvl *= rel; att = false; }
    fe *= fd;
    const a = lvl * vel * (1 + 0.3 * acc), v3 = pc * a - s2, v1 = a1 * s1 + a2 * v3, v2 = s2 + a2 * s1 + a3 * v3;
    s1 = 2 * v1 - s1; s2 = 2 * v2 - s2;
    if (i % SUB === SUB - 1) { const j = (i / SUB) | 0; LR[j] = v2; LB[j] = (0.12 + 0.88 * clamp(Math.log(clamp(base * Math.pow(2, amt * fe), 60, 4200) / 150) / FR)) * (0.2 + 0.8 * Math.min(1, a)); }
  }
  // the lead
  k = 0; ev = EV.lead; tgt = pc = 5 / 13; gate = false; lvl = 0; att = false; vel = 1;
  let held = 0; const gld = Math.exp(-dt / 0.065), dec = Math.exp(-dt / 0.9), rl = Math.exp(-dt / 0.22), hk = 1 - Math.exp(-TAU * 1.1 * dt);
  for (let i = 0; i < NP * SUB; i++) {
    const t = i * dt;
    while (k < ev.length && ev[k].t <= t) { const e = ev[k]; tgt = (e.n - 66) / 13; if (!(e.leg && gate)) { att = true; vel = e.v; } gate = true; gEnd = e.t + e.len; k++; }
    if (gate && t >= gEnd) gate = false;
    pc = tgt + (pc - tgt) * gld;
    if (gate) { if (att) { lvl += dt / 0.014; if (lvl >= 1) { lvl = 1; att = false; } } else lvl = 0.72 + (lvl - 0.72) * dec; } else { lvl *= rl; att = false; }
    held += ((lvl > 0.5 ? 1 : 0) - held) * hk;
    if (i % SUB === SUB - 1) { const j = (i / SUB) | 0; VR[j] = pc + 0.085 * Math.sin(TAU * 5.3 * t) * clamp(1.5 * held - 0.35); VA[j] = lvl * vel; }
  }
})();

// ---- canvas
const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, RM = 100, afterResize = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const top = 44, bot = 112;                                        // the panel lettering above, the row of stages below
  cx = W / 2; cy = top + (H - top - bot) / 2; RM = Math.max(70, Math.min(W * 0.455, (H - top - bot) * 0.47));
  btn.style.left = cx + 'px'; btn.style.top = cy + 'px'; msg.style.top = (cy + 44) + 'px';
  if (afterResize) afterResize();
}

// ---- drawing a stretch of the pen's path
const MAXP = 2400, PX = new Float32Array(MAXP), PY = new Float32Array(MAXP), PA = new Float32Array(MAXP), PB = new Float32Array(MAXP);
const R0 = 0.30, RG = 0.42, V0 = 0.87, VG = 0.10, RB = 0.205;       // base ring, reach of the line; the lead's band; the bass ring
// the points from t - T to t. Each sits at its own moment's angle, at the radius the pen had `shift` seconds earlier.
function points(rad, bri, t, T, shift, r0, rg, sc) {
  const j1 = Math.min(NP - 1, Math.floor(t * HZ)), j0 = Math.max(0, j1 - Math.min(MAXP - 1, Math.floor(T * HZ))), n = j1 - j0 + 1, sh = Math.round(shift * HZ);
  if (n < 2) return 0;

}
// stroke segments i0..i1, grouped into a few levels of brightness so each level is one path
function strokeLevels(i0, i1, levels, amax, width, rgb) {

// ---- state
const cells = Array.from(document.querySelectorAll('#row span'));
const toothT = new Float64Array(16).fill(-99), toothV = new Float32Array(16), toothN = new Uint8Array(16), beatT = new Float64Array(4).fill(-99);
let motes = [], opens = [], lastKick = -9, lastClap = -9, lastT = -1, frameN = 0, started = false, chordMix = 0, stageNow = -1;
function clearLive() { motes = []; opens = []; lastKick = lastClap = -9; toothT.fill(-99); beatT.fill(-99); stageNow = -1; }
const stepOf = (t) => ((Math.round(t / STEP) % 16) + 16) % 16;
const angOf = (t) => TAU * t / BAR - Math.PI / 2;

function frame(t, at, dt, live) {
  frameN++;
  if (t < lastT - 0.02 || t > lastT + 0.6) { seekCursors(Math.max(0, t - 2.5)); clearLive(); }
  lastT = t;
  const tv = live ? t : PREVIEW_T, bf = tv / BAR, bar = Math.min(D.bars - 1, Math.floor(bf));
  const gF = (tv < DUR - 7 ? 1 : 0.5 + 0.5 * Math.cos(Math.PI * clamp((tv - (DUR - 7)) / 6.5))) * (live ? 1 : 0.5);
  const pad = envAt('pad', tv), hall = envAt('hall', tv), hs = lane(L.hsend, bf);

  if (live) {
    drain('kick', t, (e) => { lastKick = e.t; beatT[stepOf(e.t) >> 2] = e.t; });
    drain('line', t, (e) => { stageNow = e.st; });
    drain('bass', t, (e) => { const s = stepOf(e.t); toothT[s] = e.t; toothV[s] = e.v * (1 + 0.3 * e.acc); toothN[s] = e.n; });
    drain('clap', t, (e) => { lastClap = e.t; });
    drain('lead', t, () => {});
    drain('hat', t, (e) => {                                         // each hat throws a mote or two off the pen; the longer it rings, the longer they live
      if (t - e.t > 0.2) return;

      for (let i = 0; i < n; i++) motes.push({ t: e.t, a: angOf(e.t) + (Math.random() - 0.5) * 0.3, r: 0.46 + Math.random() * 0.52, life: 0.1 + 9 * e.dec * (0.6 + 0.8 * Math.random()), v: clamp(e.v * 1.6, 0.15, 1) });

  chordMix += (D.chords[bar] - chordMix) * (1 - Math.exp(-dt / 0.45));
  const hz = gF * (0.06 + 0.34 * pad + 0.16 * hall) * (1 - 0.3 * duck);
  const hc = Math.round(30 + 44 * chordMix) + ',' + Math.round(62 - 10 * chordMix) + ',' + Math.round(176 + 4 * chordMix);
  let g = ctx.createRadialGradient(cx, cy, RM * 0.08, cx, cy, Math.max(RM * 1.6, Math.hypot(W, H) * 0.56));
  g.addColorStop(0, rgba(hc, hz)); g.addColorStop(0.2, rgba(hc, hz * 0.62)); g.addColorStop(0.42, rgba(hc, hz * 0.28)); g.addColorStop(0.68, rgba(hc, hz * 0.08)); g.addColorStop(1, rgba(hc, 0));

  ctx.lineWidth = 1; ctx.strokeStyle = rgba(WHITE, gF * (0.07 + 0.2 * hall)); ctx.beginPath(); ctx.arc(cx, cy, RM, 0, TAU); ctx.stroke();
  for (let i = 0; i < 16; i++) {
    const a = TAU * i / 16 - Math.PI / 2, beat = i % 4 === 0, kf = beat && live ? Math.exp(-Math.max(0, t - beatT[i >> 2]) / 0.13) * (t - beatT[i >> 2] < 1 ? 1 : 0) : 0;
    const r1 = RM + 3, r2 = RM + (beat ? 9 + 7 * kf : 6);
    ctx.lineWidth = beat ? 1.5 + kf : 1; ctx.strokeStyle = rgba(WHITE, gF * ((beat ? 0.3 : 0.16) + 0.7 * kf));
    ctx.beginPath(); ctx.moveTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)); ctx.lineTo(cx + r2 * Math.cos(a), cy + r2 * Math.sin(a)); ctx.stroke();
  }
  const cAge = t - lastClap;
  if (live && cAge >= 0 && cAge < 0.5) { const a = angOf(lastClap); ctx.lineWidth = 2; ctx.strokeStyle = rgba(WHITE, gF * 0.75 * Math.exp(-cAge / 0.09)); ctx.beginPath(); ctx.arc(cx, cy, RM, a - 0.55, a + 0.55); ctx.stroke(); }
  for (let i = opens.length - 1; i >= 0; i--) {
    const o = opens[i], age = t - o.t; if (age > 0.6 || age < 0) { opens.splice(i, 1); continue; }
    const a = angOf(o.t); ctx.lineWidth = 2; ctx.strokeStyle = rgba(GHOST, gF * 0.7 * o.v * Math.exp(-age / 0.14)); ctx.beginPath(); ctx.arc(cx, cy, RM + 13, a - 0.07, a + 0.07); ctx.stroke();
  }

  // the kick, in the middle
  if (duck > 0.01) { g = ctx.createRadialGradient(cx, cy, 0, cx, cy, RM * RB); g.addColorStop(0, rgba(WHITE, 0.2 * duck * gF)); g.addColorStop(1, rgba(WHITE, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, RM * RB, 0, TAU); ctx.fill(); }
  // the bass: sixteen teeth on the inner ring. The E an octave up reaches further; the D points inward.
  const bOpen = 0.35 + 0.65 * clamp(Math.log(lanex('bbase', bf) / 95) / Math.log(340 / 95));
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 16; i++) {
    const age = t - toothT[i]; if (!live || age < 0 || age > BAR) continue;
    const a = TAU * i / 16 - Math.PI / 2, rb = sc * RM * RB, len = RM * (0.022 + 0.04 * toothV[i]) * (toothN[i] === 52 ? 1.9 : 1) * (toothN[i] === 38 ? -1.2 : 1);
    ctx.strokeStyle = rgba(WHITE, gF * bOpen * toothV[i] * (0.1 + 0.75 * Math.exp(-age / 0.1)));
    ctx.beginPath(); ctx.moveTo(cx + rb * Math.cos(a), cy + rb * Math.sin(a)); ctx.lineTo(cx + (rb + len) * Math.cos(a), cy + (rb + len) * Math.sin(a)); ctx.stroke();
  }

  // the line. First where it has been, in blue: the wetter the reverb, the longer and wider the tail.
  const Tb = BAR * (0.8 + 2.3 * hs);
  let n = points(LR, LB, tv, Tb, 0, R0, RG, sc);
  if (n > 2) {
    for (let i = 0; i < n; i++) PA[i] = PB[i] * Math.pow(1 - (n - 1 - i) / (Tb * HZ + 1), 1.5);
    const NBK = 6;
    for (let b = 0; b < NBK; b++) { const old = 1 - (b + 0.5) / NBK; strokeLevels(Math.floor((n - 1) * b / NBK), Math.floor((n - 1) * (b + 1) / NBK), 3, gF * (0.62 - 0.3 * old), 1.5 + 9 * old * hs, BLUE); }
    // then where it is, in white
    const iw = Math.max(0, n - 1 - Math.floor(BAR * 0.42 * HZ)), span = n - 1 - iw;
    for (let i = iw; i < n; i++) PA[i] = PB[i] * Math.pow((i - iw) / span, 1.8);
    strokeLevels(iw, n - 1, 3, gF * 0.24, 5.5, GHOST);
    strokeLevels(iw, n - 1, 6, gF * 0.98, 1.7, WHITE);
    const hx = PX[n - 1], hy = PY[n - 1], hb = PB[n - 1];
    if (live) { g = ctx.createRadialGradient(hx, hy, 0, hx, hy, RM * (0.03 + 0.07 * hb)); g.addColorStop(0, rgba(WHITE, gF * (0.25 + 0.6 * hb))); g.addColorStop(1, rgba(BLUE, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, RM * (0.03 + 0.07 * hb), 0, TAU); ctx.fill(); }
  }
  // its echo: the notes of three and six sixteenths ago, drawn again where the pen is now
  const es = lane(L.esend, bf), fb = lane(L.fb, bf);
  for (let k = 1; k <= 2; k++) {
    n = points(LR, LB, tv, BAR * 0.34, 3 * k * STEP, R0, RG, sc); if (n < 3) continue;
    for (let i = 0; i < n; i++) PA[i] = PB[i] * (i / (n - 1));
    strokeLevels(0, n - 1, 3, gF * 1.5 * es * (k === 1 ? 1 : fb), 1.1, GHOST);
  }

  // the lead: a second pen on the outer band, played by hand, in amber
  n = points(VR, VA, tv, BAR * 1.6, 0, V0, VG, 1);
  if (n > 2) {
    for (let i = 0; i < n; i++) PA[i] = clamp(PB[i]) * Math.pow(i / (n - 1), 1.3);
    strokeLevels(0, n - 1, 3, gF * 0.2, 6, WARM); strokeLevels(0, n - 1, 5, gF * 0.95, 1.8, WARM);
    const va = PB[n - 1]; if (live && va > 0.05) { const hx = PX[n - 1], hy = PY[n - 1]; g = ctx.createRadialGradient(hx, hy, 0, hx, hy, RM * 0.06); g.addColorStop(0, rgba(WARM, gF * 0.8 * clamp(va))); g.addColorStop(1, rgba(WARM, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, RM * 0.06, 0, TAU); ctx.fill(); }
    n = points(VR, VA, tv, BAR * 0.7, 6 * STEP, V0 + 0.035, VG, 1);
    if (n > 2) { for (let i = 0; i < n; i++) PA[i] = clamp(PB[i]) * (i / (n - 1)); strokeLevels(0, n - 1, 3, gF * 0.34, 1.1, WARM); }
  }

  // motes: what the hats throw off
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i], age = t - m.t; if (age > m.life || age < 0) { motes.splice(i, 1); continue; }
    const k = 1 - age / m.life, r = RM * (m.r + 0.05 * age), s = age < 0.05 ? 2 : 1.5;
    ctx.fillStyle = rgba(k > 0.6 ? WHITE : GHOST, gF * m.v * k * 0.9); ctx.fillRect(cx + r * Math.cos(m.a) - s / 2, cy + r * Math.sin(m.a) - s / 2, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';

  // room tone: a few specks
  const dust = lane(L.noise, bf) * gF * 16 * dt, nd = Math.floor(dust) + (Math.random() < dust % 1 ? 1 : 0);
  for (let i = 0; i < nd; i++) { ctx.fillStyle = rgba(WHITE, 0.1 + Math.random() * 0.25); ctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1, 1); }

  if ((frameN & 3) === 0 || DEBUG_T !== null) {
    const lb = live ? bar : 0, sg = stagesAt(lb), nst = sg[1], skip = sg[2];
    for (let i = 0; i < 8; i++) cells[i].className = (i === 0 || i === 5 ? 'acc ' : '') + (i >= nst || i === skip ? 'off' : live && i === stageNow ? 'on' : '');
    cells[5].firstChild.nodeValue = lb >= 88 && lb < 104 ? 'G4' : 'F#4';
    $('sec').textContent = sectionAt(live ? bf : 0); $('barno').textContent = started ? 'bar ' + (bar + 1) : 'bar —'; $('stg').textContent = (skip >= 0 ? nst - 1 : nst) + ' of 8';
    $('bar').style.width = (100 * clamp((live ? t : 0) / DUR)).toFixed(2) + '%';
  }
}

// ---- the clock: the audio element's own time, carried between its updates by the frame clock
let anchorT = 0, anchorNow = 0, lastCt = -1, lastNow = performance.now();
function songTime(now) {
  const ct = audio.currentTime || 0;
  if (audio.paused || audio.ended || audio.seeking) { anchorT = ct; anchorNow = now; lastCt = ct; return ct; }
  if (ct !== lastCt) { lastCt = ct; const est = anchorT + (now - anchorNow) / 1000; anchorT = Math.abs(est - ct) > 0.08 ? ct : est + (ct - est) * 0.15; anchorNow = now; }
  return Math.min(DUR, anchorT + (now - anchorNow) / 1000);
}
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000)); lastNow = now;
  frame(songTime(now), now / 1000, dt, started);
}
resize(); addEventListener('resize', resize); addEventListener('orientationchange', resize);
if (DEBUG_T !== null) {            // a still at ?t=seconds, for checking a moment without the audio
  started = true; btn.classList.add('playing');
  const still = () => { lastT = -9; for (let t = Math.max(0, DEBUG_T - 4); t <= DEBUG_T; t += 1 / 60) frame(t, t, 1 / 60, true); };
  still(); afterResize = still;
} else { seekCursors(0); requestAnimationFrame(tick); }

// ---- controls
const say = (s) => { msg.textContent = s; };
async function play() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (audio.ended) audio.currentTime = 0;
  started = true; say(audio.readyState < 3 ? 'LOADING' : '');
  try { await audio.play(); } catch (e) { say(audio.error ? 'THE AUDIO DID NOT LOAD. RELOAD THE PAGE.' : 'TAP PLAY AGAIN'); }
}
btn.addEventListener('click', play);
audio.addEventListener('playing', () => { btn.classList.add('playing'); btn.setAttribute('aria-label', 'Pause'); say(''); });
audio.addEventListener('waiting', () => { if (!audio.paused) say('LOADING'); });
audio.addEventListener('pause', () => { btn.classList.remove('playing'); btn.setAttribute('aria-label', 'Play Streulicht'); btn.textContent = '▶'; });
audio.addEventListener('ended', () => { btn.classList.remove('playing'); btn.textContent = '↻'; btn.setAttribute('aria-label', 'Play again'); });
let retried = false;
audio.addEventListener('error', () => {
  if (retried || DEBUG_T !== null) { say('THE AUDIO DID NOT LOAD. RELOAD THE PAGE.'); return; }
  retried = true; say('LOADING');   // second route: fetch the file and play it from memory
  fetch(audio.getAttribute('src')).then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then((b) => { audio.src = URL.createObjectURL(b); say(started ? 'TAP PLAY' : ''); })
    .catch(() => say('THE AUDIO DID NOT LOAD. RELOAD THE PAGE.'));
});
canvas.addEventListener('click', () => { if (!audio.paused) audio.pause(); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { if (e.target === btn) return; e.preventDefault(); audio.paused ? play() : audio.pause(); }
  else if (e.code === 'ArrowRight') audio.currentTime = Math.min(DUR - 1, audio.currentTime + 5);
  else if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
});
const seek = $('seek'); let dragging = false;
const seekTo = (e) => { const x = clamp(e.clientX / W); try { audio.currentTime = x * (isFinite(audio.duration) ? audio.duration : DUR); started = true; } catch (err) {} seek.setAttribute('aria-valuenow', Math.round(x * DUR)); };

seek.addEventListener('pointerup', () => { dragging = false; });
seek.addEventListener('pointercancel', () => { dragging = false; });
})();
</script>
