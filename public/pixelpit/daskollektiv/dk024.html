<script>
// ============================================================
// GEGENLICHT: backlight. A wall of blinds, one light behind it.

// The blinds open with the filter over the track and shut a little on every kick: the sidechain.

// Everything is read from the score and from 30 fps envelopes of the stems. Plain <audio>, no WebAudio.
// ============================================================
(() => {
'use strict';

const audio = $('a'), btn = $('play'), msg = $('msg');

const BAR = D.bar, STEP = BAR / 16, FPS = D.fps, DUR = D.duration, NS = 32;
const SECTIONS = [[0, 'THROUGH THE WALL'], [8, 'RUMBLE'], [16, 'THREE CLOCKS'], [24, 'SILHOUETTE'], [32, 'OPENING'], [48, 'NO FLOOR'], [56, 'BACKLIT'], [72, 'WIDE OPEN'], [88, 'ALONE'], [92, 'RETURN'], [104, 'CLOSING'], [120, 'WALKING AWAY']];

const L = D.lanes;

// ---- the score
const EV = {};

EV.ping = D.ev.ping.map((e) => ({ t: e[0], v: e[1] * e[2], s: Math.round(e[0] / STEP) % NS }));
EV.tom = D.ev.tom.map((e) => ({ t: e[0], v: e[2], s: Math.round(e[0] / STEP) % NS }));
EV.hatc = D.ev.hatc.map((e) => ({ t: e[0], v: e[1] }));
EV.hato = D.ev.hato.map((e) => ({ t: e[0], v: e[1] }));
EV.clap = D.ev.clap.map((t) => ({ t }));
EV.rim = D.ev.rim.map((t) => ({ t }));
EV.crash = D.ev.crash.map((e) => ({ t: e[0], v: e[1] }));

// ---- canvas
const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false });

// ---- state
const slat = []; for (let i = 0; i <= NS; i++) slat.push({ w: 0.2 + Math.random() * 0.5, p: Math.random() * 6.28, jit: 0, edge: 0 });

  if (live) {

    drain('tom', t, (e) => { rows[1][e.s] = e.t; rowV[1][e.s] = clamp(e.v); });
    drain('ping', t, (e) => { rows[2][e.s] = e.t; rowV[2][e.s] = clamp(e.v * 1.2); });
    drain('acid', t, (e) => notes.push(e));
    drain('echo', t, (e) => echoes.push(e));
    drain('hatc', t, (e) => { if (t - e.t < 0.15) for (let j = 0; j < 3; j++) { const s = slat[(Math.random() * (NS + 1)) | 0]; s.jit += 0.05 * e.v / 0.5; s.edge = Math.min(1, s.edge + 0.5); } });
    drain('hato', t, (e) => { if (t - e.t < 0.15) for (let j = 0; j < 9; j++) { const s = slat[(Math.random() * (NS + 1)) | 0]; s.jit += 0.08; s.edge = Math.min(1, s.edge + 0.8); } });
    drain('clap', t, (e) => { lastClap = e.t; });
    drain('rim', t, (e) => { if (t - e.t < 0.15) { const s = slat[(Math.random() * (NS + 1)) | 0]; s.edge = 1.6; } });

    const e = echoes[i], age = t - e.t; if (age > 0.3 || age < 0) { echoes.splice(i, 1); continue; }
    drawLight(gapX(e.s), yOf(e.n), e.b, gF * e.amp * (1 - age / 0.3), 0);
  }
  // the riff itself
  for (let i = notes.length - 1; i >= 0; i--) {
    const e = notes[i], age = t - e.t; if (age < 0 || age > e.len + 0.3) { notes.splice(i, 1); continue; }
    const b = noteBright(e, t), held = age < e.len;
    const a = gF * (held ? 0.6 + 0.4 * Math.exp(-age / 0.3) : Math.exp(-(age - e.len) / 0.07)) * (0.72 + 0.28 * e.acc);
    const x = gapX(e.s), y = yOf(e.n);
    if (e.prev && age < 0.3) {          // a slide: the light crosses the slats to the next note
      const k = clamp(age / 0.11), px = gapX(e.prev.s), py = yOf(e.prev.n);
      ctx.strokeStyle = glow(hue + 8, 70, a * (1 - age / 0.3)); ctx.lineWidth = Math.max(2, H * 0.006); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + (x - px) * k, py + (y - py) * k); ctx.stroke();
    }
    drawLight(x, y, b, a, e.acc);
  }

  // the blinds
  const jd = Math.exp(-dt / 0.07), ed = Math.exp(-dt / 0.09), clapF = Math.exp(-Math.max(0, t - lastClap) / 0.05) * (t - lastClap < 0.4 ? 1 : 0);
  const edgeA = gF * (0.05 + 0.1 * hi + 0.45 * clapF);
  let xl = -P;                           // right edge of the gap to the left of slat i
  for (let i = 0; i <= NS; i++) {
    const s = slat[i]; s.jit *= jd; s.edge *= ed;
    const wob = REDUCED ? 0 : 0.22 * Math.sin(at * s.w + s.p);
    const gw = P * clamp(g0 * (1 + wob) + s.jit, 0.025, 0.6);
    const x0 = i === 0 ? -2 : xl, x1 = i === NS ? W + 2 : gapX(i) - gw / 2;
    ctx.fillStyle = '#060606'; ctx.fillRect(x0, 0, x1 - x0, H);
    const ea = edgeA + 0.35 * s.edge * gF;
    if (ea > 0.01) { ctx.fillStyle = ink(ea); if (i > 0) ctx.fillRect(x0, 0, 1, H); if (i < NS) ctx.fillRect(x1 - 1, 0, 1, H); }
    xl = gapX(i) + gw / 2;
  }
  // the kick lands on the floor: dull behind the wall at the start, plain once the filter is open
  if (duck > 0.01) { const g = ctx.createLinearGradient(0, H * 0.9, 0, H); g.addColorStop(0, ink(0)); g.addColorStop(1, ink(0.12 * duck * lane(L.kgain, bf) * (0.3 + 0.7 * wallOpen) * gF)); ctx.fillStyle = g; ctx.fillRect(0, H * 0.9, W, H * 0.1); }

  // three clocks: the kick in 4, the toms in 3, the ping in 5. Each mark stays for two bars, so the rows drift apart.
  const my = Math.max(54, H * 0.075), ms = Math.max(2, Math.min(5, Math.round(P * 0.34)));
  for (let r = 0; r < 3; r++) for (let i = 0; i < NS; i++) {
    const age = t - rows[r][i]; if (age < 0 || age > 2 * BAR) continue;
    const a = gF * rowV[r][i] * (0.16 * (1 - age / (2 * BAR)) + 0.84 * Math.exp(-age / 0.1));
    ctx.fillStyle = ink(a); ctx.fillRect(Math.round(gapX(i) - ms / 2), Math.round(my + r * (ms + 7)), ms, ms);
  }
  ctx.restore();

  // room tone: a few specks
  const dust = lane(L.noise, bf) * gF * 22 * dt, nd = Math.floor(dust) + (Math.random() < dust % 1 ? 1 : 0);
  for (let i = 0; i < nd; i++) { ctx.fillStyle = ink(0.12 + Math.random() * 0.3); ctx.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1, 1); }

  if ((frameN & 7) === 0 || DEBUG_T !== null) {
    $('sec').textContent = sectionAt(bf); $('barno').textContent = started ? 'bar ' + (bar + 1) : 'bar —'; $('chord').textContent = PAD_NAME[chord];
    $('bar').style.width = (100 * clamp(t / DUR)).toFixed(2) + '%';
  }
}

// ---- the clock: the audio element's own time, carried between its updates by the frame clock
let anchorT = 0, anchorNow = 0, lastCt = -1, lastNow = performance.now();
function songTime(now) {
  const ct = audio.currentTime || 0;
  if (audio.paused || audio.ended || audio.seeking) { anchorT = ct; anchorNow = now; lastCt = ct; return ct; }
  if (ct !== lastCt) { lastCt = ct; const est = anchorT + (now - anchorNow) / 1000; anchorT = Math.abs(est - ct) > 0.08 ? ct : est + (ct - est) * 0.15; anchorNow = now; }
  return Math.min(DUR, anchorT + (now - anchorNow) / 1000);
}
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) / 1000)); lastNow = now;
  frame(songTime(now), now / 1000, dt, started);
}
resize(); addEventListener('resize', resize); addEventListener('orientationchange', resize);
if (DEBUG_T !== null) {            // a still at ?t=seconds, for checking a moment without the audio
  started = true; btn.classList.add('playing');
  const still = () => { lastT = -9; for (let t = Math.max(0, DEBUG_T - 4); t <= DEBUG_T; t += 1 / 60) frame(t, t, 1 / 60, true); };
  still(); afterResize = still;
} else { seekCursors(0); requestAnimationFrame(tick); }

// ---- controls
const say = (s) => { msg.textContent = s; };
async function play() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (audio.ended) audio.currentTime = 0;
  started = true; say(audio.readyState < 3 ? 'LOADING' : '');
  try { await audio.play(); } catch (e) { say(audio.error ? 'THE AUDIO DID NOT LOAD. RELOAD THE PAGE.' : 'TAP PLAY AGAIN'); }
}
btn.addEventListener('click', play);
audio.addEventListener('playing', () => { btn.classList.add('playing'); btn.setAttribute('aria-label', 'Pause'); say(''); });
audio.addEventListener('waiting', () => { if (!audio.paused) say('LOADING'); });
audio.addEventListener('pause', () => { btn.classList.remove('playing'); btn.setAttribute('aria-label', 'Play Gegenlicht'); btn.textContent = '▶'; });
audio.addEventListener('ended', () => { btn.classList.remove('playing'); btn.textContent = '↻'; btn.setAttribute('aria-label', 'Play again'); });
let retried = false;
audio.addEventListener('error', () => {
  if (retried || DEBUG_T !== null) { say('THE AUDIO DID NOT LOAD. RELOAD THE PAGE.'); return; }
  retried = true; say('LOADING');   // second route: fetch the file and play it from memory
  fetch(audio.getAttribute('src')).then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then((b) => { audio.src = URL.createObjectURL(b); say(started ? 'TAP PLAY' : ''); })
    .catch(() => say('THE AUDIO DID NOT LOAD. RELOAD THE PAGE.'));
});
canvas.addEventListener('click', () => { if (!audio.paused) audio.pause(); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { if (e.target === btn) return; e.preventDefault(); audio.paused ? play() : audio.pause(); }
  else if (e.code === 'ArrowRight') audio.currentTime = Math.min(DUR - 1, audio.currentTime + 5);
  else if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
});
const seek = $('seek'); let dragging = false;
const seekTo = (e) => { const x = clamp(e.clientX / W); try { audio.currentTime = x * (isFinite(audio.duration) ? audio.duration : DUR); started = true; } catch (err) {} seek.setAttribute('aria-valuenow', Math.round(x * DUR)); };
seek.addEventListener('pointerdown', (e) => { dragging = true; try { seek.setPointerCapture(e.pointerId); } catch (err) {} seekTo(e); });
seek.addEventListener('pointermove', (e) => { if (dragging) seekTo(e); });
seek.addEventListener('pointerup', () => { dragging = false; });
seek.addEventListener('pointercancel', () => { dragging = false; });
})();
</script>
